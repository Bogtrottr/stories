<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bogtrottr — Short Stories</title>
  <style>
    :root {
      --bg: #0f0f11;
      --card: #1a1a1f;
      --card-hover: #25252d;
      --text: #f4f4f6;
      --muted: #9ca3af;
      --accent: #a78bfa;
      --border: #2e2e36;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 32px 20px 80px;
      min-height: 100vh;
    }
    .wrapper {
      max-width: 680px;
      margin: 0 auto;
    }
    /* Top Navigation Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 28px;
      margin-bottom: 36px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.01em;
      color: var(--text);
      text-decoration: none;
    }
    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .nav-link {
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .nav-link:hover {
      color: var(--text);
      background: var(--card);
    }
    .writer-btn {
      border-color: var(--border);
      background: var(--card);
      color: var(--text);
    }
    .writer-btn:hover {
      border-color: var(--accent);
    }

    /* Intro Section */
    .intro {
      margin-bottom: 32px;
    }
    .intro h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    .intro p {
      color: var(--muted);
      font-size: 0.98rem;
    }

    /* Story Cards List */
    .story-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .story-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .story-card:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
      border-color: #42424d;
    }
    .story-meta {
      display: flex;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin-bottom: 8px;
    }
    .story-card h2 {
      font-size: 1.25rem;
      margin-bottom: 8px;
    }
    .story-card p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Full Story Reader View */
    #reader-view {
      display: none;
    }
    .back-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
      margin-bottom: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover {
      background: var(--card-hover);
    }
    .article-header {
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .article-header h1 {
      font-size: 2rem;
      line-height: 1.25;
      margin-bottom: 10px;
    }
    .article-body {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.12rem;
      line-height: 1.85;
      color: #e5e5ea;
    }
    .article-body p {
      margin-bottom: 22px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <a href="#" class="brand" onclick="showList(); return false;">// bogtrottr.stories</a>
      <div class="nav-actions">
        <a href="https://bogtrottr.github.io" class="nav-link">Links</a>
        <!-- Takes you directly to your password-protected GitHub editor -->
        <a href="https://github.com/Bogtrottr/stories/edit/main/stories.json" target="_blank" class="nav-link writer-btn">Writer Login</a>
      </div>
    </header>

    <!-- Home View: Story Archive -->
    <main id="list-view">
      <div class="intro">
        <h1>Short Stories &amp; Notes</h1>
        <p>Original fiction, late-night drafts, and standalone worlds.</p>
      </div>
      <div id="story-container" class="story-list">
        <p style="color: var(--muted);">Loading stories...</p>
      </div>
    </main>

    <!-- Reader View: Individual Story -->
    <article id="reader-view">
      <button class="back-btn" onclick="showList()">&larr; All Stories</button>
      <div class="article-header">
        <div id="reader-meta" class="story-meta"></div>
        <h1 id="reader-title"></h1>
      </div>
      <div id="reader-body" class="article-body"></div>
    </article>
  </div>

  <script>
    let allStories = [];

    async function loadStories() {
      try {
        const res = await fetch('stories.json');
        allStories = await res.json();
        renderList();
      } catch (err) {
        document.getElementById('story-container').innerHTML =
          '<p style="color: var(--muted);">Could not load stories yet. Make sure stories.json is saved!</p>';
      }
    }

    function renderList() {
      const container = document.getElementById('story-container');
      container.innerHTML = '';

      allStories.forEach((story, index) => {
        const card = document.createElement('div');
        card.className = 'story-card';
        card.onclick = () => openStory(index);
        card.innerHTML = `
          <div class="story-meta">
            <span>${story.genre}</span>
            <span>&bull;</span>
            <span>${story.date}</span>
            <span>&bull;</span>
            <span>${story.readTime}</span>
          </div>
          <h2>${story.title}</h2>
          <p>${story.excerpt}</p>
        `;
        container.appendChild(card);
      });
    }

    function openStory(index) {
      const story = allStories[index];
      document.getElementById('reader-meta').textContent =
        `${story.genre} • ${story.date} • ${story.readTime}`;
      document.getElementById('reader-title').textContent = story.title;

      const bodyEl = document.getElementById('reader-body');
      bodyEl.innerHTML = '';
      story.content.forEach(paragraph => {
        const p = document.createElement('p');
        p.textContent = paragraph;
        bodyEl.appendChild(p);
      });

      document.getElementById('list-view').style.display = 'none';
      document.getElementById('reader-view').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function showList() {
      document.getElementById('reader-view').style.display = 'none';
      document.getElementById('list-view').style.display = 'block';
      window.scrollTo(0, 0);
    }

    loadStories();
  </script>
</body>
</html>
